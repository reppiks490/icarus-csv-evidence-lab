name: restored-five-durability-watchdog

on:
  push:
    branches: [main]
    paths:
      - "tools/restored_five_durability_watchdog.py"
      - "tools/test_restored_five_durability_watchdog.py"
      - ".github/workflows/restored-five-durability-watchdog.yml"
      - "automation_intelligence/advanced_csv/**"
      - "automation_intelligence/advanced_csv/finalization_state.json"
  schedule:
    # Two independent 10-minute streams, staggered by 5 minutes. Effective
    # 5-minute coverage reduces dependence on any one delayed/dropped cron.
    - cron: "2-52/10 * * * *"
    - cron: "7-57/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: restored-five-durability-watchdog
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run watchdog unit tests
        shell: bash
        run: python tools/test_restored_five_durability_watchdog.py -q

      - name: Worker mirror grace
        if: github.event_name == 'push'
        shell: bash
        run: sleep 20

      - name: Refresh main after grace
        shell: bash
        run: git pull --rebase origin main

      - name: Re-run watchdog unit tests after refresh
        shell: bash
        run: python tools/test_restored_five_durability_watchdog.py -q

      - name: Reconcile Advanced CSV runtime
        run: >-
          python tools/restored_five_durability_watchdog.py
          --repo-root .
          --stale-minutes 30
          --monitor-grace-minutes 12
          --monitor-after "2026-09-30T21:00:00Z"
          --stabilization-fallback
          --lane "advanced_csv|automation_intelligence/advanced_csv|6abaef9d5c28819190d98a5af7f308b8|15|advanced-csv"

      - name: Stage only Advanced CSV runtime state
        shell: bash
        run: |
          set -euo pipefail
          paths=(
            automation_intelligence/advanced_csv/startup_state.json
            automation_intelligence/advanced_csv/finalization_state.json
            automation_intelligence/advanced_csv/heartbeat.json
            automation_intelligence/advanced_csv/watchdog_incidents.jsonl
          )
          for path in "${paths[@]}"; do
            if [ -e "$path" ]; then
              git add -- "$path"
            fi
          done

          if git diff --cached --quiet; then
            echo "WATCHDOG_NO_CHANGE=1" >> "$GITHUB_ENV"
            exit 0
          fi

          staged="$(git diff --cached --name-only)"
          invalid="$(printf '%s\n' "$staged" | grep -Ev '^automation_intelligence/advanced_csv/(startup_state|finalization_state|heartbeat)\.json$|^automation_intelligence/advanced_csv/watchdog_incidents\.jsonl$' || true)"
          if [ -n "$invalid" ]; then
            echo "Refusing out-of-scope watchdog mutation:" >&2
            printf '%s\n' "$invalid" >&2
            exit 1
          fi
          echo "WATCHDOG_NO_CHANGE=0" >> "$GITHUB_ENV"

      - name: Commit verified recovery state
        if: env.WATCHDOG_NO_CHANGE != '1'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "automation: Advanced CSV durability recovery $(date -u +%Y%m%dT%H%M%SZ) [skip ci]"
          # Fail closed on concurrent main movement. Never rebase a recovery
          # decision computed against an older snapshot; the next watchdog
          # cycle will recompute from fresh main.
          git push origin HEAD:main

      - name: Bind committed finalization into heartbeat
        if: env.WATCHDOG_NO_CHANGE != '1'
        shell: bash
        run: |
          set -euo pipefail
          # The first watchdog pass may create a newer finalization fallback.
          # Its Git commit SHA does not exist until the preceding commit is
          # pushed, so a heartbeat written in that same commit cannot truthfully
          # bind the new finalization identity. Re-run only the 3-field lane
          # reconciliation after the finalization commit exists.
          python tools/restored_five_durability_watchdog.py --repo-root . --stale-minutes 30 --receipt-first-stale-minutes 12 --lane "advanced_csv|automation_intelligence/advanced_csv|6abaef9d5c28819190d98a5af7f308b8"

          git add -- automation_intelligence/advanced_csv/startup_state.json automation_intelligence/advanced_csv/heartbeat.json

          if git diff --cached --quiet; then
            echo "No post-commit heartbeat mirror repair required."
            exit 0
          fi

          staged="$(git diff --cached --name-only)"
          invalid="$(printf '%s\n' "$staged" | grep -Ev '^automation_intelligence/advanced_csv/(startup_state|heartbeat)\.json$' || true)"
          if [ -n "$invalid" ]; then
            echo "Refusing out-of-scope post-commit heartbeat mutation:" >&2
            printf '%s\n' "$invalid" >&2
            exit 1
          fi

          git commit -m "automation: bind Advanced CSV heartbeat to committed finalization [skip ci]"
          # Do not rebase a mirror computed against stale main. If another
          # writer moved main, fail closed and let the next watchdog recompute.
          git push origin HEAD:main
