name: restored-five-watchdog-ci

on:
  pull_request:
    branches: [main]
    paths:
      - "tools/restored_five_durability_watchdog.py"
      - "tools/test_restored_five_durability_watchdog.py"
      - ".github/workflows/restored-five-durability-watchdog.yml"
      - ".github/workflows/restored-five-watchdog-ci.yml"
  push:
    branches: [main]
    paths:
      - "tools/restored_five_durability_watchdog.py"
      - "tools/test_restored_five_durability_watchdog.py"
      - ".github/workflows/restored-five-durability-watchdog.yml"
      - ".github/workflows/restored-five-watchdog-ci.yml"

permissions:
  contents: read

jobs:
  watchdog-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run restored-five watchdog tests
        shell: bash
        run: |
          set +e
          python tools/test_restored_five_durability_watchdog.py -q 2>&1 | tee /tmp/watchdog-tests.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            {
              echo "### restored-five watchdog failure"
              echo '~~~text'
              tail -n 120 /tmp/watchdog-tests.log
              echo '~~~'
            } >> "$GITHUB_STEP_SUMMARY"
            cp /tmp/watchdog-tests.log watchdog-tests.log
            exit "$status"
          fi

      - name: Upload watchdog failure log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: watchdog-test-failure
          path: watchdog-tests.log
          if-no-files-found: error
          retention-days: 1
